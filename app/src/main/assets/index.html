const sv = () => LS.s = JSON.stringify(S);

const dec = t => {

// Registro de Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {

// Carga del IFrame API de YouTube
function loadYT() {
  if (window.YT && window.YT.Player) {
    if (!P) initYTPlayer();
    return;
  }
  if (ytLoading) return;
  ytLoading = true;
  const prevTag = document.querySelector('script[src*="youtube.com/iframe_api"]');
  if (prevTag) prevTag.remove();
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => { ytLoading = false; };
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = () => {
  ytLoading = false;
  initYTPlayer();
};

function initYTPlayer() {
  if (P || !window.YT || !window.YT.Player) return;
  P = new YT.Player('yt', {
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      rel: 0,
      playsinline: 1,
      modestbranding: 1,
      origin: window.location.origin
    },
    events: {
      onReady: () => {
        playerReady = true;
        if (started && !off && items.length > 0) {
          play(cur >= 0 ? cur : 0);
        }
      },
      onError: () => handleVideoError(),
      onStateChange: e => {
        const s = e.data;
        if (s === 1) {
          consecutiveErrors = 0;
          stuckSeconds = 0;
        } else if (s === 0) {
          next();
        } else if (s === 2 || s === -1 || s === 5) {
          ensurePlaying();
        }
      }
    }
  });
}

// ==================== INDEXEDDB ====================
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ninostube', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('videos')) {
        db.createObjectStore('videos', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('videos', 'readonly');
      const store = tx.objectStore('videos');
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return [];
  }
}

async function dbPut(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    const store = tx.objectStore('videos');
    const req = store.put(record);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    const store = tx.objectStore('videos');
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// Obtener lista de videos guardados (Android.getVideos() o IndexedDB)
async function getSavedVideos() {
  if (window.Android && typeof window.Android.getVideos === 'function') {
    try {
      const res = window.Android.getVideos();
      const list = typeof res === 'string' ? JSON.parse(res || '[]') : (res || []);
      if (Array.isArray(list)) {
        return list.map(item => {
          if (typeof item === 'string') {
            return {
              id: item,
              title: (S[item] && S[item].t) || item,
              videoUrl: `/videos/${item}.mp4`,
              thumbUrl: `/thumbs/${item}.jpg`
            };
          }
          const id = item.id || item.videoId || '';
          return {
            id: id,
            title: item.title || item.t || (S[id] && S[id].t) || id,
            size: item.size || 0,
            videoUrl: item.videoUrl || `/videos/${id}.mp4`,
            thumbUrl: item.thumbUrl || `/thumbs/${id}.jpg`
          };
        });
      }
    } catch (e) {
      return [];
    }
  }
  return await dbGetAll();
}

// Generación de miniatura de video (320x320 recortado al centro)
function generateThumb(videoBlob) {
  return new Promise(resolve => {
    try {
      const v = document.createElement('video');
      v.muted = true;
      v.playsInline = true;
      v.preload = 'metadata';
      const url = URL.createObjectURL(videoBlob);
      v.src = url;

      const clean = () => {
        v.removeAttribute('src');
        v.load();
        URL.revokeObjectURL(url);
      };

      const timer = setTimeout(() => {
        clean();
        resolve(null);
      }, 6000);

      v.onloadeddata = () => {
        const d = v.duration || 0;
        v.currentTime = Math.min(3, d * 0.2 || 0);
      };

      v.onseeked = () => {
        clearTimeout(timer);
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 320;
          const ctx = canvas.getContext('2d');
          const vw = v.videoWidth || 320;
          const vh = v.videoHeight || 320;
          const minDim = Math.min(vw, vh);
          const sx = (vw - minDim) / 2;
          const sy = (vh - minDim) / 2;
          ctx.drawImage(v, sx, sy, minDim, minDim, 0, 0, 320, 320);
          canvas.toBlob(blob => {
            clean();
            resolve(blob);
          }, 'image/jpeg', 0.8);
        } catch (e) {
          clean();
          resolve(null);
        }
      };

      v.onerror = () => {
        clearTimeout(timer);
        clean();
        resolve(null);
      };
    } catch (e) {
      resolve(null);
    }
  });
}

// Generación en segundo plano de miniaturas faltantes
async function checkMissingThumbs() {
  if (window.Android || bgThumbBusy || !navigator.onLine || off) return;
  bgThumbBusy = true;
  try {
    const list = await dbGetAll();
    const missing = list.find(x => !x.thumb && !x.thumbTried && x.blob);
    if (missing) {
      const thumb = await generateThumb(missing.blob);
      if (thumb) {
        missing.thumb = thumb;
        delete missing.thumbTried;
        await dbPut(missing);
      } else {
        missing.thumbTried = true;
        await dbPut(missing);
      }
    }
  } catch (e) {
  } finally {
    bgThumbBusy = false;
  }
}
setInterval(checkMissingThumbs, 4000);

// Persistencia de almacenamiento
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

// ==================== GESTOS Y CONTROLES ====================
function hold(el, fn) {
  let t;
  const s = e => {
    e.preventDefault();
    el.classList.add('h');
    t = setTimeout(() => {
      el.classList.remove('h');
      fn();
    }, 2000);
  };
  const c = () => {
    clearTimeout(t);
    el.classList.remove('h');
  };
  el.addEventListener('pointerdown', s);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => el.addEventListener(n, c));
}

// Engrane y PIN

$('#pno').onclick = () => $('#pin').style.display = 'none';

  } else {
    $('#pi').value = '';
    if (++errs >= 3) {

      $('#pm').textContent = 'PIN incorrecto';
    }

};

$('#pi').onkeydown = e => {

};

function normStr(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

function renderSavedListUI(savedVideos) {
  const listEl = $('#savedList');
  if (!listEl) return;
  listEl.innerHTML = '';
  if (!savedVideos.length) {
    listEl.innerHTML = '<div style="color:#666;font-size:11px;padding:8px 0">No hay videos guardados</div>';
  } else {
    savedVideos.forEach(v => {
      const row = document.createElement('div');
      row.className = 'r';

      const titleSpan = document.createElement('span');
      titleSpan.className = 'title';
      titleSpan.textContent = v.title || v.id;

      const metaSpan = document.createElement('span');
      metaSpan.className = 'meta';
      const sizeMb = v.size ? (v.size / 1048576).toFixed(1) : '0.0';
      const views = (S[v.id] && S[v.id].v) ? S[v.id].v : 0;
      metaSpan.textContent = `${sizeMb} MB · ${views} vistas `;

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑';
      delBtn.style.cssText = 'padding:2px 8px;margin:0';
      delBtn.onclick = async () => {
        if (window.Android && typeof window.Android.deleteVideo === 'function') {
          try { window.Android.deleteVideo(v.id); } catch(e) {}
        } else {
          await dbDelete(v.id);
        }
        if (S[v.id]) {
          S[v.id].d = 0;
          sv();
        }
        savedVideos = savedVideos.filter(x => x.id !== v.id);
        $('#saveCount').textContent = `Guardados: ${savedVideos.length} / 70`;
        renderSavedListUI(savedVideos);
      };
      metaSpan.appendChild(delBtn);

      row.appendChild(titleSpan);
      row.appendChild(metaSpan);
      listEl.appendChild(row);
    });
  }
}

  renderSavedListUI(savedVideos);

  $('#akp').onclick = async () => {

  const fileInput = $('#fi');
  if (fileInput) {

      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      const total = files.length;
      $('#importRes').textContent = `Procesando ${total} archivos...`;

      let imported = 0;
      let errors = 0;
      let unmatched = 0;
      const assignedIds = new Set();
      const batchImportedIds = new Set();
      const TWENTY_MIN = 20 * 60 * 1000;

      for (let i = 0; i < total; i++) {
        const file = files[i];
        $('#importRes').textContent = `Importando ${i + 1} de ${total}...`;

        try {
          const rawName = file.name.replace(/\.[^/.]+$/, '').trim();
          const isDownloadName = /^download(\s*\(\d+\))?$/i.test(rawName);
          let matchId = null;

          if (!isDownloadName) {
            const nFile = normStr(rawName);
            const favEntries = Object.entries(S).filter(([id, data]) => data && (data.f || data.t) && !assignedIds.has(id));

            for (const [id, data] of favEntries) {
              if (normStr(data.t) === nFile) {
                matchId = id;
                break;
              }
            }

            if (!matchId) {
              for (const [id, data] of favEntries) {
                const nFav = normStr(data.t);
                const minLen = Math.min(nFile.length, nFav.length);
                if (minLen >= 12 && (nFile.includes(nFav) || nFav.includes(nFile))) {
                  matchId = id;
                  break;
                }
              }
            }
          }

          if (!matchId && file.lastModified) {
            const fTime = file.lastModified;
            const candidates = [];

            for (const [id, data] of Object.entries(S)) {
              if (data && data.l && !data.d && !assignedIds.has(id)) {
                if (data.l <= fTime + 5000 && (fTime - data.l) <= TWENTY_MIN) {
                  candidates.push([id, data]);
                }
              }
            }

            if (candidates.length > 0) {
              candidates.sort((a, b) => b[1].l - a[1].l);
              matchId = candidates[0][0];
            }
          }

          if (savedVideos.length >= 70) {
            const toDeleteCandidates = savedVideos.filter(v => !batchImportedIds.has(v.id));
            if (toDeleteCandidates.length > 0) {
              toDeleteCandidates.sort((a, b) => ((S[a.id] || {}).v || 0) - ((S[b.id] || {}).v || 0));
              const toRemove = toDeleteCandidates[0];
              await dbDelete(toRemove.id);
              if (S[toRemove.id]) {
                S[toRemove.id].d = 0;
              }
              savedVideos = savedVideos.filter(v => v.id !== toRemove.id);
            }
          }

          let saveId = '';
          let title = '';

          if (matchId) {
            assignedIds.add(matchId);
            S[matchId].d = 1;
            saveId = matchId;
            title = S[matchId].t || rawName;
            imported++;
          } else {
            saveId = 'x_' + Math.abs(strHash(rawName)) + '_' + Math.random().toString(36).slice(2, 6);
            title = 'Video importado';
            S[saveId] = { v: 0, t: title, d: 1, f: 0 };
            imported++;
            unmatched++;
          }

          batchImportedIds.add(saveId);
          sv();

          const thumb = await generateThumb(file);

          const newRecord = {
            id: saveId,
            title: title,
            size: file.size,
            blob: file,
            thumb: thumb,
            thumbTried: !thumb
          };

          await dbPut(newRecord);
          savedVideos = savedVideos.filter(v => v.id !== saveId);
          savedVideos.push(newRecord);

        } catch (err) {
          errors++;
          $('#importRes').textContent = `Error en ${file.name}: ${err.message || err}`;
          await new Promise(r => setTimeout(r, 200));
        }
      }

      importMsg = `Importados ${imported}, con error ${errors}, sin pareja ${unmatched}`;
      savedVideos = await getSavedVideos();
      $('#saveCount').textContent = `Guardados: ${savedVideos.length} / 70`;
      renderSavedListUI(savedVideos);
      $('#importRes').textContent = importMsg;
    };
  }

  $('#cl').onclick = async () => {

    try {

        await document.documentElement.requestFullscreen();
      }
    } catch (e) {}
  };

  $('#cfg').style.display = 'grid';
}

function strHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

// Semilla
function seed() {
  qi++;
  if (qi % 3 === 0) {
    const t = Object.values(S).filter(x => x.v > 0).sort((a, b) => b.v - a.v)[0];
    if (t && t.t) return t.t;
  }
  return SEEDS[Math.random() * SEEDS.length | 0];
}

// Búsqueda infinita en YouTube
async function more() {
  if (busy || !K || Date.now() < apiCooldownUntil || off) return;
  busy = true;
  try {
    if (!Q) {
      Q = seed();
      tok = '';
    }
    const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&safeSearch=strict&videoEmbeddable=true&videoSyndicated=true&q=' +
      encodeURIComponent(Q) + (tok ? '&pageToken=' + tok : '') + '&key=' + K;
    const res = await fetch(url);
    const j = await res.json();
    if (j.error) {
      apiCooldownUntil = Date.now() + 60000;
      return;
    }
    tok = j.nextPageToken || '';
    if (!tok) Q = '';
    let n = 0;
    for (const it of j.items || []) {
      const id = it.id.videoId;
      if (!id || seen.has(id)) continue;
      seen.add(id);
      n++;
      const o = {
        id,
        t: dec(it.snippet.title),
        th: (it.snippet.thumbnails.high || it.snippet.thumbnails.default).url
      };
      items.push(o);
      if (!off) {
        card(o, items.length - 1);
      }
    }
    if (started && cur === -1 && playerReady && items.length > 0 && !off) {
      play(0);
    }
    if (!n && tok) setTimeout(more, 300);
  } catch (e) {
    apiCooldownUntil = Date.now() + 60000;
  } finally {
    busy = false;
    setTimeout(near, 400);
  }
}

function fav(id, t, targetEl) {
  const s = S[id] = S[id] || { v: 0, t: t };
  s.f = 1;
  sv();

  showStarPop(targetEl);
  showStarOnCard(id);

  const now = Date.now();
  const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

  // No volver a descargar si ya existe S[id].d, S[id].q o S[id].l (salvo que pasen 24 horas sin guardarse d=0)
  let shouldDownload = false;
  if (s.d) {
    shouldDownload = false;
  } else if (s.q) {
    shouldDownload = false;
  } else if (s.l) {
    if (now - s.l >= TWENTY_FOUR_HOURS) {
      shouldDownload = true;
    } else {
      shouldDownload = false;
    }
  } else {
    shouldDownload = true;
  }

  if (shouldDownload) {
    if (window.Android && typeof window.Android.queueDownload === 'function') {
      s.l = now;
      delete s.q;
      sv();
      try {
        window.Android.queueDownload(id, t || id);
      } catch (e) {}
    } else {
      if (now - lastLaunchTime >= 90000 && navigator.onLine && !off) {
        lastLaunchTime = now;
        delete s.q;
        s.l = now;
        sv();

        try {
          const template = LS.dl || DEFAULT_DL;
          const url = template.replace('ID', id);

          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.setAttribute('download', '');
          a.target = 'dlFrame';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => a.remove(), 1000);
        } catch (e) {}
      } else {
        queueDownload(id, t);
      }
    }
  }
}

function queueDownload(id, t) {
  const s = S[id] = S[id] || { v: 0, t: t };
  if (window.Android && typeof window.Android.queueDownload === 'function') {
    s.t = t;
    s.l = Date.now();
    delete s.q;
    sv();
    try {
      window.Android.queueDownload(id, t || id);
    } catch (e) {}
    return;
  }
  s.q = 1;
  s.t = t;
  sv();
}

  const now = Date.now();
  if (now - lastLaunchTime < 90000) return;

  const queuedEntry = Object.entries(S).find(([id, data]) => data && data.q && !data.d);

    const frame = $('#dlFrame');

    }

    delete data.q;

    sv();
  } catch (e) {
  } finally {
    isLaunching = false;
  }
}

async function ping() {

    const timer = setTimeout(() => c.abort(), 1000);
    await fetch('https://www.gstatic.com/generate_204?' + Date.now(), {
      mode: 'no-cors',
      cache: 'no-store',
      signal: c.signal
    });
    clearTimeout(timer);
    return true;
  } catch (e) {
    return false;
  }
}

async function net() {
  if (!started) return;
  if (!navigator.onLine) {
    fails++;
    if (waitingForLocalEnd) waitingForLocalEnd = false;
    await goOff();
    return;
  }
  if (isPinging) return;
  isPinging = true;
  try {
    const ok = await ping();
    if (ok) {
      lastPingSuccess = true;
      apiCooldownUntil = 0;
      fails = 0;
      if (!window.YT || !P) {
        loadYT();
      }
      if (off && !waitingForLocalEnd) {
        goOn();
      }
    } else {
      lastPingSuccess = false;
      fails++;
      if (waitingForLocalEnd) {
        waitingForLocalEnd = false;
      }
      const st = (P && P.getPlayerState) ? P.getPlayerState() : -1;
      if (!off && (fails >= 2 || st !== 1)) {
        await goOff();
      }
    }
  } catch (e) {
  } finally {
    isPinging = false;
  }
}

    const saved = await getSavedVideos();
    if (saved.length > 0) {
      await goOff();
      return;
    }
  }

  if (K && !items.length) {
    await more();
  }

  if (playerReady && items.length > 0 && cur === -1 && !off) {
    play(0);
  }
};

// Carga inicial
loadYT();
if (K) {
  more();
}
</script>
