<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<title>NinosTube</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  color: #fff;
  font: 900 12px 'Arial Black', Arial, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
#app {
  display: flex;
  height: 100%;
  width: 100%;
}
#L {
  flex: 1;
  position: relative;
  min-width: 0;
  background: #000;
  height: 100%;
}
#yt, #off {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
#off {
  display: none;
  background: #000;
  z-index: 1;
}
#ov {
  position: absolute;
  inset: 0;
  z-index: 2;
  cursor: pointer;
}
.hb {
  position: absolute;
  top: 10px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #ffffff30;
  z-index: 5;
  display: grid;
  place-items: center;
  font-size: 20px;
  touch-action: none;
  transition: transform .2s;
  cursor: pointer;
}
.hb.h {
  transform: scale(1.5);
  background: #f33a;
  transition: transform 2s linear;
}
#sb {
  position: absolute;
  top: 10px;
  left: 68px;
  right: 68px;
  z-index: 6;
  display: none;
  gap: 6px;
}
#R {
  width: 27vw;
  min-width: 190px;
  max-width: 320px;
  overflow-y: auto;
  background: #0f0f0f;
  padding: 6px;
  -webkit-overflow-scrolling: touch;
  height: 100%;
}
.c {
  margin-bottom: 10px;
  position: relative;
  cursor: pointer;
}
.c .i {
  aspect-ratio: 1;
  background: #222 center/cover no-repeat;
  border-radius: 10px;
}
.c.on .i {
  outline: 3px solid #f33;
}
.c b {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.25;
}
.c s {
  position: absolute;
  top: 4px;
  right: 8px;
  text-decoration: none;
  color: #fc0;
  font-size: 18px;
}
.m {
  position: fixed;
  inset: 0;
  background: #000e;
  z-index: 20;
  display: none;
  place-items: center;
}
.m > div {
  background: #1c1c1c;
  padding: 16px;
  border-radius: 12px;
  width: min(520px, 92vw);
  max-height: 90vh;
  overflow: auto;
  user-select: text;
  -webkit-user-select: text;
}
input, button {
  font: inherit;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #333;
  color: #fff;
}
input {
  width: 100%;
  user-select: text;
  -webkit-user-select: text;
}
button {
  cursor: pointer;
  margin: 3px 0;
}
.r {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #333;
  font-size: 11px;
}
.r span.title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.r span.meta {
  flex-shrink: 0;
  color: #aaa;
  display: flex;
  align-items: center;
  gap: 8px;
}
#start-screen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
}
#start-btn {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: #f33;
  color: #fff;
  border: 5px solid #fff;
  font-size: 64px;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 0 50px rgba(255, 51, 51, 0.7);
  touch-action: manipulation;
  transition: transform 0.15s ease, background 0.15s ease;
  padding-left: 10px;
}
#start-btn:active {
  transform: scale(0.92);
  background: #d11;
}
#start-txt {
  font-size: 20px;
  letter-spacing: 0.5px;
  text-align: center;
  color: #fff;
}
</style>
</head>
<body>

<div id="start-screen">
  <div id="start-btn">▶</div>
  <div id="start-txt">TOCA PARA EMPEZAR</div>
</div>

<div id="app">
  <div id="L">
    <div id="yt"></div>
    <video id="off" playsinline></video>
    <div id="ov"></div>
    <div class="hb" id="lupa" style="left:10px">🔍</div>
    <div class="hb" id="gear" style="right:10px">⚙</div>
    <div id="sb">
      <input id="q" placeholder="buscar...">
      <button id="sx">✕</button>
    </div>
  </div>
  <div id="R">
    <div id="rl"></div>
    <div id="sent" style="height:40px"></div>
  </div>
</div>

<div class="m" id="pin">
  <div>
    <div style="margin-bottom:8px">PIN</div>
    <input id="pi" type="password" inputmode="numeric" maxlength="4" style="margin-bottom:8px">
    <div style="display:flex;gap:6px">
      <button id="pok" style="flex:1">Entrar</button>
      <button id="pno" style="flex:1">Cancelar</button>
    </div>
    <div id="pm" style="color:#f55;margin-top:8px"></div>
  </div>
</div>

<div class="m" id="cfg">
  <div id="cb"></div>
</div>

<iframe id="dlFrame" style="display:none;width:0;height:0;border:0;"></iframe>

<script>
const $ = s => document.querySelector(s), LS = localStorage;

const DEFAULT_DL = 'https://apipy.ssyoutube-downloader.com/youtube/download?url=https://www.youtube.com/watch?v=ID&type=video&height=360';

const SEEDS = [
  'canciones infantiles',
  'cocomelon',
  'pocoyo',
  'bluey español',
  'peppa pig español',
  'dibujos animados para niños',
  'baby shark',
  'aprende colores niños',
  'aprende numeros niños',
  'animales para niños',
  'canciones de la granja',
  'cuentos infantiles',
  'plaza sesamo',
  'la vaca lola',
  'paw patrol español',
  'masha y el oso',
  'canciones para bebes',
  'caricaturas clasicas'
];

let K = LS.k || '';
let S = JSON.parse(LS.s || '{}');
let items = [];
let seen = new Set();
let cur = -1;
let Q = '';
let tok = '';
let busy = false;
let P = null;
let playerReady = false;
let started = false;
let qi = 0;
let secs = 0;
let errs = 0;
let lockT = 0;
let consecutiveErrors = 0;
let errorTimer = null;
let resumeTimer = null;
let lastTime = -1;
let stuckSeconds = 0;
let apiCooldownUntil = 0;
let last = {};
let lastLaunchTime = 0;
let isLaunching = false;

// Modo sin internet
let off = false;
let localList = [];
let localIndex = 0;
let currentOffId = '';
let currentBlobUrl = null;
let waitingForLocalEnd = false;
let fails = 0;
let isPinging = false;
let lastPingSuccess = false;
let importMsg = '';
let localConsecutiveErrors = 0;
let localErrorTimer = null;
let ytLoading = false;

const sv = () => LS.s = JSON.stringify(S);

const dec = t => {
  const e = document.createElement('textarea');
  e.innerHTML = t;
  return e.value;
};

// ==================== SERVICE WORKER ====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ==================== CARGA DINÁMICA DE YOUTUBE ====================
function loadYT() {
  if (window.YT && window.YT.Player) {
    initYTPlayer();
    return;
  }
  if (ytLoading || document.getElementById('yt-script')) return;
  ytLoading = true;
  const tag = document.createElement('script');
  tag.id = 'yt-script';
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => {
    ytLoading = false;
    tag.remove();
  };
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = () => {
  ytLoading = false;
  initYTPlayer();
};

function initYTPlayer() {
  if (P) return;
  P = new YT.Player('yt', {
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      fs: 0,
      rel: 0,
      iv_load_policy: 3,
      playsinline: 1,
      modestbranding: 1,
      origin: window.location.origin
    },
    events: {
      onReady: () => {
        playerReady = true;
        if (started && !off && items.length > 0) {
          play(cur >= 0 ? cur : 0);
        }
      },
      onError: () => handleVideoError(),
      onStateChange: e => {
        const s = e.data;
        if (s === 1) {
          consecutiveErrors = 0;
          stuckSeconds = 0;
        } else if (s === 0) {
          next();
        } else if (s === 2 || s === -1 || s === 5) {
          ensurePlaying();
        }
      }
    }
  });
}

// ==================== INDEXEDDB ====================
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ninostube', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('videos')) {
        db.createObjectStore('videos', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('videos', 'readonly');
      const store = tx.objectStore('videos');
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return [];
  }
}

async function dbPut(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    const store = tx.objectStore('videos');
    const req = store.put(record);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    const store = tx.objectStore('videos');
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbCount() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('videos', 'readonly');
      const store = tx.objectStore('videos');
      const req = store.count();
      req.onsuccess = () => resolve(req.result || 0);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return 0;
  }
}

// Persistencia de almacenamiento
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

// ==================== GESTOS Y CONTROLES ====================
function hold(el, fn) {
  let t;
  const s = e => {
    e.preventDefault();
    el.classList.add('h');
    t = setTimeout(() => {
      el.classList.remove('h');
      fn();
    }, 2000);
  };
  const c = () => {
    clearTimeout(t);
    el.classList.remove('h');
  };
  el.addEventListener('pointerdown', s);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => el.addEventListener(n, c));
}

// Lupa
hold($('#lupa'), () => {
  $('#sb').style.display = 'flex';
  $('#q').focus();
});
$('#sx').onclick = () => $('#sb').style.display = 'none';

$('#q').onkeydown = async e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  $('#sb').style.display = 'none';
  e.target.value = '';
  if (!K) return;
  apiCooldownUntil = 0;
  Q = v;
  tok = '';
  items = [];
  seen.clear();
  $('#rl').innerHTML = '';
  cur = -1;
  await more();
  if (items.length) play(0);
};

// Engrane y PIN
hold($('#gear'), () => {
  if (Date.now() < lockT) return;
  $('#pm').textContent = '';
  $('#pi').value = '';
  $('#pin').style.display = 'grid';
  $('#pi').focus();
});

$('#pno').onclick = () => $('#pin').style.display = 'none';

$('#pok').onclick = () => {
  if ($('#pi').value === '3623') {
    errs = 0;
    $('#pin').style.display = 'none';
    openCfg();
  } else {
    $('#pi').value = '';
    if (++errs >= 3) {
      errs = 0;
      lockT = Date.now() + 30000;
      $('#pin').style.display = 'none';
    } else {
      $('#pm').textContent = 'PIN incorrecto';
    }
  }
};

$('#pi').onkeydown = e => {
  if (e.key === 'Enter') $('#pok').click();
};

function normStr(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

// Panel de configuración
async function openCfg() {
  const b = $('#cb');
  const savedVideos = await dbGetAll();
  const count = savedVideos.length;

  b.innerHTML = '<p style="margin-top:0;font-size:13px;color:#f33">CONFIGURACIÓN</p>' +
    '<p style="margin:8px 0 4px">API key de YouTube:</p>' +
    '<input id="ak" style="margin-bottom:6px" autocomplete="off">' +
    '<div style="display:flex;gap:6px">' +
    '<button id="akp" style="flex:1">Pegar</button>' +
    '<button id="aks" style="flex:1">Guardar key</button>' +
    '</div>' +
    '<hr style="border:0;border-top:1px solid #333;margin:12px 0">' +
    '<p style="margin:4px 0">Plantilla URL de descarga (ID se reemplaza):</p>' +
    '<input id="dlt" style="margin-bottom:6px;font-size:11px" autocomplete="off">' +
    '<div style="display:flex;gap:6px">' +
    '<button id="dlts" style="flex:1">Guardar plantilla</button>' +
    '</div>' +
    '<hr style="border:0;border-top:1px solid #333;margin:12px 0">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
    '<span id="saveCount">Guardados: ' + count + ' / 50</span>' +
    '<button id="btnImport" style="padding:6px 14px">Importar videos</button>' +
    '<input type="file" id="fi" multiple accept="video/*" style="display:none">' +
    '</div>' +
    '<div id="importRes" style="margin:4px 0 10px;color:#aaa;font-size:11px;min-height:14px"></div>' +
    '<div id="savedList" style="max-height:220px;overflow-y:auto;border-top:1px solid #222;padding-top:4px"></div>' +
    '<div style="margin-top:14px;text-align:right">' +
    '<button id="cl" style="min-width:100px">Cerrar</button>' +
    '</div>';

  $('#ak').value = K;
  $('#dlt').value = LS.dl || DEFAULT_DL;
  $('#importRes').textContent = importMsg;

  $('#akp').onclick = async () => {
    try {
      $('#ak').value = (await navigator.clipboard.readText()).trim();
    } catch (e) {}
  };

  $('#aks').onclick = async () => {
    K = $('#ak').value.trim();
    LS.k = K;
    apiCooldownUntil = 0;
    if (K && !off) {
      items = [];
      seen.clear();
      $('#rl').innerHTML = '';
      cur = -1;
      tok = '';
      Q = '';
      await more();
      if (items.length) play(0);
    }
  };

  $('#dlts').onclick = () => {
    const val = $('#dlt').value.trim();
    if (val) {
      LS.dl = val;
    }
  };

  $('#btnImport').onclick = () => {
    $('#fi').click();
  };

  $('#fi').onchange = async e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;

    let curCount = await dbCount();
    let imported = 0;
    let unmatched = 0;

    for (const file of files) {
      if (curCount >= 50) break;

      const rawName = file.name.replace(/\.[^/.]+$/, '');
      const nFile = normStr(rawName);

      const favEntries = Object.entries(S).filter(([id, data]) => data && (data.f || data.t));
      let matchId = null;

      for (const [id, data] of favEntries) {
        if (normStr(data.t) === nFile) {
          matchId = id;
          break;
        }
      }

      if (!matchId) {
        for (const [id, data] of favEntries) {
          const nFav = normStr(data.t);
          const minLen = Math.min(nFile.length, nFav.length);
          if (minLen >= 12 && (nFile.includes(nFav) || nFav.includes(nFile))) {
            matchId = id;
            break;
          }
        }
      }

      let saveId = matchId;
      if (matchId) {
        S[matchId].d = 1;
        imported++;
      } else {
        saveId = 'x_' + Math.abs(strHash(rawName)) + '_' + Math.random().toString(36).slice(2, 6);
        S[saveId] = { v: 0, t: rawName, d: 1, f: 0 };
        imported++;
        unmatched++;
      }

      sv();
      await dbPut({
        id: saveId,
        title: (S[saveId] && S[saveId].t) ? S[saveId].t : rawName,
        size: file.size,
        blob: file
      });
      curCount++;
    }

    importMsg = `Importados ${imported}, sin pareja ${unmatched}` + (curCount >= 50 ? ' (tope de 50 alcanzado)' : '');
    openCfg();
  };

  const listEl = $('#savedList');
  listEl.innerHTML = '';
  if (!savedVideos.length) {
    listEl.innerHTML = '<div style="color:#666;font-size:11px;padding:8px 0">No hay videos guardados</div>';
  } else {
    savedVideos.forEach(v => {
      const row = document.createElement('div');
      row.className = 'r';

      const titleSpan = document.createElement('span');
      titleSpan.className = 'title';
      titleSpan.textContent = v.title || v.id;

      const metaSpan = document.createElement('span');
      metaSpan.className = 'meta';
      const sizeMb = (v.size / 1048576).toFixed(1);
      const views = (S[v.id] && S[v.id].v) ? S[v.id].v : 0;
      metaSpan.textContent = `${sizeMb} MB · ${views} vistas `;

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑';
      delBtn.style.cssText = 'padding:2px 8px;margin:0';
      delBtn.onclick = async () => {
        await dbDelete(v.id);
        if (S[v.id]) {
          S[v.id].d = 0;
          sv();
        }
        openCfg();
      };
      metaSpan.appendChild(delBtn);

      row.appendChild(titleSpan);
      row.appendChild(metaSpan);
      listEl.appendChild(row);
    });
  }

  $('#cl').onclick = () => $('#cfg').style.display = 'none';
  $('#cfg').style.display = 'grid';
}

function strHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

// Semilla
function seed() {
  qi++;
  if (qi % 3 === 0) {
    const t = Object.values(S).filter(x => x.v > 0).sort((a, b) => b.v - a.v)[0];
    if (t && t.t) return t.t;
  }
  return SEEDS[Math.random() * SEEDS.length | 0];
}

// Búsqueda infinita en YouTube
async function more() {
  if (busy || !K || Date.now() < apiCooldownUntil || off) return;
  busy = true;
  try {
    if (!Q) {
      Q = seed();
      tok = '';
    }
    const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&safeSearch=strict&videoEmbeddable=true&videoSyndicated=true&q=' +
      encodeURIComponent(Q) + (tok ? '&pageToken=' + tok : '') + '&key=' + K;
    const res = await fetch(url);
    const j = await res.json();
    if (j.error) {
      apiCooldownUntil = Date.now() + 60000;
      return;
    }
    tok = j.nextPageToken || '';
    if (!tok) Q = '';
    let n = 0;
    for (const it of j.items || []) {
      const id = it.id.videoId;
      if (!id || seen.has(id)) continue;
      seen.add(id);
      n++;
      const o = {
        id,
        t: dec(it.snippet.title),
        th: (it.snippet.thumbnails.high || it.snippet.thumbnails.default).url
      };
      items.push(o);
      card(o, items.length - 1);
    }
    if (started && cur === -1 && playerReady && items.length > 0 && !off) {
      play(0);
    }
    if (!n && tok) setTimeout(more, 300);
  } catch (e) {
    apiCooldownUntil = Date.now() + 60000;
  } finally {
    busy = false;
    setTimeout(near, 400);
  }
}

function near() {
  if (Date.now() < apiCooldownUntil || off) return;
  const r = $('#R');
  if (r.scrollHeight - r.scrollTop - r.clientHeight < 1500) more();
}
$('#R').addEventListener('scroll', near);

function card(o, i) {
  const d = document.createElement('div');
  d.className = 'c' + (i === cur ? ' on' : '');
  d.id = 'c' + i;
  d.innerHTML = '<div class="i" style="background-image:url(' + o.th + ')"></div><b></b>' +
    ((S[o.id] && S[o.id].f) ? '<s>★</s>' : '');
  d.querySelector('b').textContent = o.t;
  d.onclick = () => {
    const n = Date.now();
    if (n - (last[o.id] || 0) < 350) {
      fav(o.id, o.t);
      return;
    }
    last[o.id] = n;
    if (i !== cur && !off) play(i);
  };
  $('#rl').appendChild(d);
}

function play(i) {
  if (i < 0 || i >= items.length || off) return;
  cur = i;
  secs = 0;
  stuckSeconds = 0;
  lastTime = -1;
  document.querySelectorAll('.c.on').forEach(e => e.classList.remove('on'));
  const c = $('#c' + i);
  if (c) {
    c.classList.add('on');
    c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  if (P && P.loadVideoById) {
    P.loadVideoById(items[i].id);
    P.unMute();
    P.playVideo();
  }
}

async function next() {
  if (off) return;
  stuckSeconds = 0;
  lastTime = -1;
  secs = 0;
  if (cur + 1 >= items.length) {
    if (K) {
      await more();
    }
  }
  if (cur + 1 < items.length) {
    play(cur + 1);
  } else if (items.length > 0) {
    play(0);
  }
}

// Vistas y favoritos
function view(id, t) {
  const s = S[id] = S[id] || { v: 0, t: t };
  s.v++;
  if (s.v >= 10 && !s.f) {
    fav(id, t);
  }
  sv();
}

function fav(id, t) {
  const s = S[id] = S[id] || { v: 0, t: t };
  s.f = 1;
  sv();

  const now = Date.now();
  const isSaved = !!s.d;
  const isQueued = !!s.q;
  const launchedRecently = s.l && (now - s.l < 86400000); // 24 horas

  if (!isSaved && !isQueued && !launchedRecently) {
    queueDownload(id, t);
  }

  const k = items.findIndex(x => x.id === id);
  if (k > -1) {
    const c = $('#c' + k);
    if (c && !c.querySelector('s')) {
      c.insertAdjacentHTML('beforeend', '<s>★</s>');
    }
  }
}

function queueDownload(id, t) {
  const s = S[id] = S[id] || { v: 0, t: t };
  s.q = 1;
  s.t = t;
  sv();
}

// Lanzador de descargas cada 90 segundos
async function checkDownloadQueue() {
  if (!navigator.onLine || off || isLaunching) return;
  const now = Date.now();
  if (now - lastLaunchTime < 90000) return;

  const count = await dbCount();
  if (count >= 50) return;

  const queuedEntry = Object.entries(S).find(([id, data]) => data && data.q && !data.d);
  if (!queuedEntry) return;

  const [id, data] = queuedEntry;
  isLaunching = true;
  lastLaunchTime = now;

  try {
    const template = LS.dl || DEFAULT_DL;
    const url = template.replace('ID', id);

    const frame = $('#dlFrame');
    if (frame) {
      frame.src = url;
    }

    delete data.q;
    data.l = now;
    sv();
  } catch (e) {
  } finally {
    isLaunching = false;
  }
}

setInterval(checkDownloadQueue, 5000);

// ==================== MODO SIN INTERNET ====================
async function ping() {
  try {
    const c = new AbortController();
    const timer = setTimeout(() => c.abort(), 1500);
    await fetch('https://www.gstatic.com/generate_204?' + Date.now(), {
      mode: 'no-cors',
      cache: 'no-store',
      signal: c.signal
    });
    clearTimeout(timer);
    return true;
  } catch (e) {
    return false;
  }
}

async function net() {
  if (!started || isPinging) return;
  isPinging = true;
  try {
    const ok = navigator.onLine && await ping();
    if (ok) {
      lastPingSuccess = true;
      apiCooldownUntil = 0;
      fails = 0;
      if (!window.YT || !P) {
        loadYT();
      }
      if (off && !waitingForLocalEnd) {
        goOn();
      }
    } else {
      lastPingSuccess = false;
      fails++;
      if (waitingForLocalEnd) {
        waitingForLocalEnd = false; // Se volvió a caer el internet
      }
      const st = (P && P.getPlayerState) ? P.getPlayerState() : -1;
      if (!off && (fails >= 2 || st !== 1)) {
        await goOff();
      }
    }
  } catch (e) {
  } finally {
    isPinging = false;
  }
}

setInterval(net, 2000);
window.addEventListener('offline', () => net());
window.addEventListener('online', () => net());

// Vigilante cada 3 segundos: recuperación de conexión y arranque pendiente
setInterval(() => {
  if (started && !off && lastPingSuccess) {
    if (!items.length && K) {
      more();
    } else if (items.length && P) {
      const st = (typeof P.getPlayerState === 'function') ? P.getPlayerState() : -1;
      if (cur === -1 || ((st === -1 || st === 5) && cur >= 0)) {
        play(cur >= 0 ? cur : 0);
      }
    }
  }
}, 3000);

async function goOff() {
  if (off) return;
  const saved = await dbGetAll();
  if (!saved.length) return;

  off = true;
  waitingForLocalEnd = false;

  try {
    if (P && P.pauseVideo) P.pauseVideo();
  } catch (e) {}

  localList = saved.sort((a, b) => ((S[b.id] || {}).v || 0) - ((S[a.id] || {}).v || 0));
  localIndex = 0;

  $('#off').style.display = 'block';
  offPlay();
}

function offPlay() {
  if (!localList.length) return;
  const x = localList[localIndex % localList.length];
  currentOffId = x.id;
  secs = 0;

  if (currentBlobUrl) {
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }

  try {
    currentBlobUrl = URL.createObjectURL(x.blob);
    const v = $('#off');
    v.src = currentBlobUrl;
    v.play().catch(() => {
      // Reintentar en el siguiente toque si el navegador bloquea la reproducción automática
      const retryPlay = () => {
        if (off && v && v.paused) {
          v.play().catch(() => {});
        }
      };
      document.addEventListener('pointerdown', retryPlay, { once: true });
    });
  } catch (e) {
    localIndex++;
    setTimeout(offPlay, 250);
  }
}

function goOn() {
  if (!off) return;
  waitingForLocalEnd = true;
}

async function finishGoOn() {
  waitingForLocalEnd = false;
  off = false;
  const v = $('#off');
  v.pause();
  if (currentBlobUrl) {
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }
  v.removeAttribute('src');
  v.style.display = 'none';
  secs = 0;

  if (items.length > 0) {
    next();
  } else if (K) {
    await more();
    if (items.length > 0) play(0);
  }
}

// Eventos del video local
const vOff = $('#off');
vOff.onplaying = () => {
  localConsecutiveErrors = 0;
};
vOff.onended = () => {
  if (waitingForLocalEnd) {
    finishGoOn();
  } else {
    localIndex++;
    offPlay();
  }
};
vOff.onerror = () => {
  if (waitingForLocalEnd) {
    finishGoOn();
    return;
  }
  localConsecutiveErrors++;
  if (localConsecutiveErrors >= 3) {
    clearTimeout(localErrorTimer);
    localErrorTimer = setTimeout(() => {
      localConsecutiveErrors = 0;
      localIndex++;
      offPlay();
    }, 3000);
  } else {
    localIndex++;
    offPlay();
  }
};

// Doble toque sobre el video
$('#ov').onclick = () => {
  const n = Date.now();
  if (n - (last.ov || 0) < 350) {
    const vidId = off ? currentOffId : (items[cur] ? items[cur].id : null);
    if (vidId) {
      const t = (S[vidId] || {}).t || (items[cur] ? items[cur].t : vidId);
      fav(vidId, t);
    }
  }
  last.ov = n;
};

// Contador de 30 segundos
setInterval(() => {
  if (off) {
    const v = $('#off');
    const pl = v && !v.paused && v.readyState >= 2;
    if (pl && currentOffId) {
      if (++secs === 30) {
        view(currentOffId, (S[currentOffId] || {}).t || currentOffId);
      }
    }
  } else {
    const pl = P && P.getPlayerState && P.getPlayerState() === 1;
    const it = items[cur];
    if (pl && it) {
      if (++secs === 30) {
        view(it.id, (S[it.id] || {}).t || it.t);
      }
    }
  }
}, 1000);

// Errores YouTube
handleVideoError = function() {
  consecutiveErrors++;
  if (consecutiveErrors >= 5) {
    clearTimeout(errorTimer);
    errorTimer = setTimeout(() => {
      consecutiveErrors = 0;
      next();
    }, 3000);
  } else {
    next();
  }
};

// Reanudar a los 250 ms si se pausa
function ensurePlaying() {
  if (off) return;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    if (!off && P && P.playVideo) {
      const s = P.getPlayerState ? P.getPlayerState() : -1;
      if (s === 2 || s === -1 || s === 5) {
        P.playVideo();
      }
    }
  }, 250);
}

// Vigilante de atasco en YouTube
setInterval(() => {
  if (off || !started || cur < 0 || !P || !P.getPlayerState || !P.getCurrentTime) return;
  const state = P.getPlayerState();
  if (state === 1 || state === 3 || state === 2 || state === -1) {
    let ct = -1;
    try { ct = P.getCurrentTime(); } catch(e) {}
    if (ct >= 0 && Math.abs(ct - lastTime) < 0.25) {
      if (navigator.onLine) {
        stuckSeconds++;
        if (stuckSeconds >= 12) {
          stuckSeconds = 0;
          lastTime = -1;
          next();
          return;
        }
      }
    } else {
      stuckSeconds = 0;
      lastTime = ct;
    }
  } else {
    stuckSeconds = 0;
  }
}, 1000);

// Wake Lock
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && started) {
    requestWakeLock();
  }
});

setInterval(() => {
  if (started && !document.hidden) {
    requestWakeLock();
  }
}, 300000);

// Pantalla inicial
$('#start-btn').onclick = async () => {
  started = true;
  $('#start-screen').style.display = 'none';

  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    }
  } catch (e) {}

  await requestWakeLock();

  // Si ya hay un video local cargado, reproducirlo
  if (off) {
    const v = $('#off');
    if (v && v.src) v.play().catch(() => {});
    return;
  }

  // Detección inicial
  const isNet = navigator.onLine && await ping();
  if (isNet) {
    lastPingSuccess = true;
    apiCooldownUntil = 0;
  } else {
    lastPingSuccess = false;
    const saved = await dbGetAll();
    if (saved.length > 0) {
      await goOff();
      return;
    }
  }

  if (K && !items.length) {
    await more();
  }

  if (playerReady && items.length > 0 && cur === -1 && !off) {
    play(0);
  }
};

// Carga inicial
loadYT();
if (K) {
  more();
}
</script>
